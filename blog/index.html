<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header id="site-header">
    <a href="#" id="blog-name"></a>
    <a href="#" class="header-link">
      <img src="icons/page_white_text.png" width="16" height="16" alt="">
      posts
    </a>
  </header>

  <main id="content">

    <div id="home-view">
      <section id="hero">
        <div id="hero-content"></div>
        <div id="hero-links"></div>
      </section>

      <section id="posts-section">
        <h2 class="section-label">// posts</h2>
        <ul id="post-list"></ul>
      </section>
    </div>

    <article id="post-view" hidden>
      <a href="#" class="back-link">&larr; all posts</a>
      <div id="post-tags" class="tags"></div>
      <h1 id="post-title"></h1>
      <div id="post-meta"></div>
      <div id="post-body" class="prose"></div>
    </article>

  </main>

  <footer id="site-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
